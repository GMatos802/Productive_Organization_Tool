<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productive_Organization=</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="main_container">

        <div class="header">
            <h1>Productive Organization</h1>
            <p>Organize your tasks and be more productive</p>
        </div>

        <div class="tasks_list">
            <ul class="ul_task_list">
                <li>
                    <input type="checkbox" id="Default">
                    <label for="Default">Default Checkbox</label>
                </li>
            </ul>
        </div>

        <div class="buttons">
            <button class="add_button">Add Task</button>
            <button class="remove_button">Remove Task</button>
        </div>

    </div>

    <div class="hidden task_modal">
        <h2>Create a New Task</h2>
        <label for="t_name">Task:</label>
        <input type="text" id="t_name">
        <label for="t_description">Description:</label>
        <textarea id="t_description" rows="5"></textarea>
        <label for="t_time">Estimated Time (Minutes):</label>
        <input type="number" id="t_time">
        <label for="t_conclusion">Completed:</label>
        <input type="checkbox" id="t_conclusion">
        <label for="t_difficulty"></label>
        <select id="t_difficulty">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
        </select>
        <button>Create</button>
        <button>Reset</button>
        <button>X</button>
    </div>

</body>
</html>
